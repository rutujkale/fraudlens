# FraudLens global configuration. Profiles merge `common` with the profile section.
# Two parameters are intentionally profile-driven and documented here:
# - `drift.start_fraction` is the fraction of the profile's [start, start+days] window after
#   which the fraud scenario/stealth mixture switches from Period A to Period B.
# - The `main` profile places the drift switch at the START of the test window by design:
#   validation sees pre-drift fraud, the test window sees post-drift fraud (concept drift
#   between val and test is intentional and expected).
common:
  seed: 42
  currency: INR
  start_date: "2026-01-01"
  reporting_threshold: 50000        # structuring reference amount (₹)
  customers_archetype_mix: {conservative: 0.30, regular: 0.40, high_spend: 0.10, frequent_digital: 0.15, business_like: 0.05}
  fraud_scenarios: [burst, account_takeover, amount_anomaly, geo_anomaly, structuring]
  scenario_mix_period_a: {burst: 0.22, account_takeover: 0.28, amount_anomaly: 0.22, geo_anomaly: 0.16, structuring: 0.12}
  scenario_mix_period_b: {burst: 0.15, account_takeover: 0.25, amount_anomaly: 0.12, geo_anomaly: 0.08, structuring: 0.40}
  stealth_beta_period_a: [2.0, 3.0]   # fairly obvious fraud (mean ≈ 0.40)
  stealth_beta_period_b: [3.0, 2.0]   # subtler fraud (mean ≈ 0.60)
  hard_negative_target_share: 0.04    # ≈4% of legit tx belong to hard-negative episodes
  fraud_device_reuse_prob: 0.35       # fraud often reuses a known device (weakens new-device shortcut)
  family_shared_device_share: 0.04    # legit shared devices so device-sharing is not a trivial signal
  splits: {train_end_fraction: 0.60, val_end_fraction: 0.80}   # embargo = max label delay (days)
  # windows_minutes: 10m, 1h, 6h, 24h, 7d(=10080), 30d(=43200). Feature code keys
  # off these exact values, so a missing window fails loudly rather than silently.
  features:
    version: features_v1
    windows_minutes: [10, 60, 360, 1440, 10080, 43200]
    near_threshold_band: [0.55, 1.0]   # structuring band as a multiple of reporting_threshold
    travel_speed_cap_kmh: 1000.0       # implied-speed cap (commercial-flight scale)
    hour_deviation_halfwidth_hours: 2  # +/- hours counted as "usual hour"
    hour_deviation_min_prior: 5        # below this prior count, hour_deviation is NaN
    amount_std_floor: 1.0e-6           # min std for the amount z-score (avoid /0)
    trend_window_days: 7               # recent vs previous window for trend features
  costs:
    fraud_loss_rate: 0.85
    fraud_fixed_fee: 0
    review_cost: 75
    friction_cost: 150
    review_catch_rate: 0.90
    stepup_cost: 5
    stepup_friction_cost: 40
    stepup_stop_rate: 0.60
    block_friction_cost: 450
    capacity_pct_of_daily_volume: 0.01   # review capacity as a share of average daily volume
    analyst_daily_capacity: null         # optional absolute override
  cost_scenarios:
    low_fp_cost:    {friction_cost: 50,  review_cost: 40}
    balanced:       {}
    high_fp_cost:   {friction_cost: 400, review_cost: 120}
    high_fraud_loss: {fraud_loss_rate: 1.0, fraud_fixed_fee: 300}
  ks: [0.001, 0.005, 0.01, 0.02, 0.05]          # recall@top-K fractions
  precision_targets: [0.9, 0.8, 0.7]
  bootstrap: {n: 500, cluster_by: customer_id}
  api: {max_batch: 1000}
  validation: {max_amount: 10000000.0, max_fraud_rate: 0.05}
  # Part 03 separability gate. Thresholds are deliberately fixed: a small gap between the
  # depth-3 tree and the boosted reference is treated as a simulator shortcut, not a reason
  # to lower the bar. Tune the simulator, not these numbers.
  separability_gate:
    max_single_signal_roc_auc: 0.85
    max_single_signal_pr_auc: 0.20
    tree3_vs_boosted_min_pr_auc_gap: 0.05
    min_hard_negative_overlap_signals: 2
    boosted: {n_estimators: 300, max_depth: 6, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8}

profiles:
  tiny:       {customers: 300,   days: 30,  target_fraud_rate: 0.02,  label_delay_days: [1, 3],  drift: {start_fraction: null, strength: 0.0}}
  dev:        {customers: 5000,  days: 120, target_fraud_rate: 0.008, label_delay_days: [2, 7],  drift: {start_fraction: 0.88, strength: 0.5}}
  main:       {customers: 20000, days: 270, target_fraud_rate: 0.005, label_delay_days: [3, 21], drift: {start_fraction: 0.88, strength: 0.5}}
  drift_lab:  {customers: 10000, days: 240, target_fraud_rate: 0.006, label_delay_days: [3, 14], drift: {start_fraction: 0.50, strength: 1.0}}
  unseen_lab: {customers: 15000, days: 180, target_fraud_rate: 0.005, label_delay_days: [3, 14], drift: {start_fraction: null, strength: 0.0}, scenario_mix_override: {burst: 0.15, account_takeover: 0.20, amount_anomaly: 0.15, geo_anomaly: 0.15, structuring: 0.35}}